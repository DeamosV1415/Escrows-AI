<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo.png" />

    <!-- ══════════ Primary SEO ══════════ -->
    <title>Escrows AI — Never Miss a Follow-Up Again</title>
    <meta
      name="description"
      content="Escrows AI is an AI-powered CRM and follow-up engine for commercial real estate brokers. Manage deals, track conversations, automate outreach, and close faster."
    />
    <meta
      name="keywords"
      content="CRE CRM, commercial real estate AI, broker follow-up automation, escrow management, real estate workflow, AI CRM"
    />
    <meta name="author" content="Escrows AI" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://escrowsai.com/" />

    <!-- ══════════ Open Graph (Facebook / LinkedIn) ══════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Escrows AI" />
    <meta
      property="og:title"
      content="Escrows AI — Never Miss a Follow-Up Again"
    />
    <meta
      property="og:description"
      content="Transform your client relationships with intelligent automation, seamless document management, and AI-powered insights that close deals faster."
    />
    <meta property="og:image" content="https://escrowsai.com/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://escrowsai.com/" />

    <!-- ══════════ Twitter / X Card ══════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@escrowsai" />
    <meta
      name="twitter:title"
      content="Escrows AI — Never Miss a Follow-Up Again"
    />
    <meta
      name="twitter:description"
      content="AI-powered CRM and follow-up engine for CRE brokers. Close more deals with less effort."
    />
    <meta name="twitter:image" content="https://escrowsai.com/preview.png" />

    <!-- ══════════ JSON-LD Structured Data — Organization ══════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Escrows AI",
        "url": "https://escrowsai.com",
        "logo": "https://escrowsai.com/Logo.png",
        "description": "AI-powered CRM and follow-up engine for commercial real estate brokers.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9109120671",
          "contactType": "customer support",
          "email": "contact@escrowsai.com",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://x.com/escrowsai",
          "https://www.linkedin.com/company/escrows-ai/"
        ]
      }
    </script>

    <!-- ══════════ JSON-LD Structured Data — WebSite (Sitelinks Search Box) ══════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Escrows AI",
        "url": "https://escrowsai.com"
      }
    </script>

    <!-- ══════════ Google Fonts ══════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
